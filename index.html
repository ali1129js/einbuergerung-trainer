<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2329" />
    <meta name="description" content="Study app for the German Einbürgerungstest (Leben in Deutschland), Brandenburg." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Einbürgerung" />
    <title>Einbürgerungstest Trainer</title>
    <script>
      /* Apply the saved theme and motion before first paint (mirrors src/lib/theme.ts). */
      (function () {
        var colors = { khaki: "#1E2329", graphite: "#161A20", midnight: "#140F1E" };
        var legacy = { light: "khaki", "dark-blue": "midnight", "dark-grey": "graphite" };
        var t = null;
        try { t = JSON.parse(localStorage.getItem("einb-trainer.theme.v1") || "null"); } catch (e) {}
        if (legacy[t]) t = legacy[t];
        if (!colors.hasOwnProperty(t)) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "graphite" : "khaki";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t === "khaki" ? "light" : "dark";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[t]);
        var motion = "static";
        try { if (localStorage.getItem("einb-trainer.motion.v1") === "animated") motion = "animated"; } catch (e) {}
        if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) motion = "static";
        document.documentElement.dataset.motion = motion;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
